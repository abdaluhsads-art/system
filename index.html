<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>الديون والمخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F5F1; --card:#FFFFFF; --text:#20261F; --muted:#8A8F87;
    --teal:#0E6B5C; --teal-soft:#E6F3EF; --emerald:#0E9A6E; --emerald-soft:#E8F8F0;
    --amber:#B4700B; --amber-soft:#FBF0DD;
    --rose:#C13B2E; --rose-soft:#FBEAE8;
    --border:#EAE7E0; --chip:#F1EFE9;
    --shadow:0 1px 2px rgba(32,38,31,.05), 0 6px 16px rgba(32,38,31,.04);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
  #app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;
    background:var(--bg);position:relative;}
  #content{flex:1;overflow-y:auto;padding:14px 16px 96px;}
  h1{font-size:20px;margin:2px 0 16px;font-weight:800;letter-spacing:-.2px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:linear-gradient(var(--bg) 78%, transparent);
    padding-top:8px;z-index:5;gap:8px;}
  .btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:700;font-size:13.5px;
    cursor:pointer;font-family:inherit;transition:transform .1s ease, opacity .15s ease;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:active{transform:scale(.96);}
  .btn-secondary{background:var(--teal-soft);color:var(--teal);}
  .btn-block{width:100%;padding:15px;border-radius:16px;font-size:15px;}
  .btn-ghost{background:var(--chip);color:var(--muted);}
  .btn-danger{background:var(--rose);color:#fff;}
  .btn-disabled{background:#DCD9D2;color:#fff;cursor:not-allowed;}
  .btn:disabled{opacity:.58;cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--teal);font-weight:700;font-size:13px;
    padding:0;cursor:pointer;font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px;text-align:right;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);}
  .tile .icon{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;
    justify-content:center;margin-bottom:12px;font-size:15px;}
  .tile .val{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.3px;}
  .tile .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;}
  .section-title{font-size:12.5px;font-weight:800;color:var(--muted);margin:20px 2px 9px;
    display:flex;justify-content:space-between;align-items:center;}
  .empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--radius-lg);
    padding:22px 16px;color:#A7ACA3;font-size:13px;text-align:center;}
  .lowstock-row{background:var(--amber-soft);border:1px solid #F1DFB8;
    border-radius:var(--radius-md);padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;margin-bottom:7px;}
  .lowstock-row b{color:var(--text);font-size:13.5px;}
  .lowstock-row span{color:var(--amber);font-weight:800;font-size:12.5px;}
  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;padding:11px 38px 11px 12px;border-radius:var(--radius-md);
    border:1px solid var(--border);background:var(--card);font-size:14px;outline:none;font-family:inherit;}
  .search input:focus{box-shadow:0 0 0 2px var(--teal);border-color:transparent;}
  .search .ic{position:absolute;right:13px;top:11px;color:#B9BCB4;font-size:14px;}
  .card-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:var(--shadow);}
  .thumb{width:44px;height:44px;border-radius:12px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;color:#B9BCB4;font-size:17px;
    object-fit:cover;flex-shrink:0;}
  .grow{flex:1;min-width:0;}
  .name{font-weight:700;font-size:14.5px;}
  .sub{font-size:11.5px;color:#B9BCB4;margin-top:1px;}
  .price{font-size:12px;color:var(--muted);margin-top:3px;}
  .stock-row{width:100%;display:block;color:inherit;font:inherit;text-align:right;cursor:pointer;}
  .stock-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .stock-head .name{overflow-wrap:anywhere;}
  .stock-count{background:var(--chip);border-radius:var(--radius-sm);padding:7px 9px;}
  .stock-count b{display:block;font-size:17px;color:var(--text);line-height:1.3;}
  .stock-count span{display:block;color:var(--muted);font-size:11px;}
  .stock-count.shop{background:var(--teal-soft);}
  .stock-count.shop b{color:var(--teal);}
  .stock-count.shop.low{background:var(--amber-soft);}
  .stock-count.shop.low b{color:var(--amber);}
  .stock-details{margin:0 0 14px;}
  .stock-details .stock-count{padding:11px 13px;}
  .stock-details .stock-count b{font-size:23px;}
  .stock-actions{margin-bottom:14px;}
  .stock-remove{display:flex;justify-content:flex-end;margin-top:14px;}
  .stock-remove .link-btn{color:var(--rose);}
  .icon-btn{background:var(--chip);border:none;border-radius:9px;width:29px;height:29px;
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:13px;}
  label.field{display:block;margin-bottom:13px;}
  .field-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .in{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 12px;font-size:14px;outline:none;font-family:inherit;color:var(--text);}
  .in:focus{box-shadow:0 0 0 2px var(--teal);border-color:transparent;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:1px;box-shadow:var(--shadow);}
  .stat-box .val{font-weight:800;font-size:18px;letter-spacing:-.2px;}
  .stat-box .val.small{font-size:12.5px;}
  .stat-box .lbl{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:600;}
  .summary-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px;display:flex;flex-direction:column;gap:9px;margin-bottom:14px;box-shadow:var(--shadow);}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:700;}
  .v.rose{color:var(--rose);}
  .v.emerald{color:var(--emerald);}
  .period-tabs{display:flex;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:4px;margin-bottom:14px;box-shadow:var(--shadow);}
  .period-tabs button{flex:1;border:none;background:transparent;padding:9px 0;
    border-radius:10px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .period-tabs button.active{background:var(--teal);color:#fff;}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .chart-card .ct{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:10px;}
  .cart-qty{display:flex;align-items:center;gap:0;background:var(--chip);
    border-radius:11px;padding:2px;}
  .cart-qty button{width:26px;height:26px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;}
  .cart-qty input{width:40px;text-align:center;font-weight:800;font-size:13px;border:none;
    background:transparent;font-family:inherit;color:var(--text);outline:none;}
  .notice{font-size:12px;background:var(--amber-soft);color:var(--amber);
    border:1px solid #F1DFB8;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;}
  .notice.success{background:var(--emerald-soft);color:var(--emerald);border-color:#BEE9D5;font-weight:700;
    display:flex;align-items:center;gap:6px;}
  .picker-item{display:flex;justify-content:space-between;align-items:center;
    width:100%;text-align:right;background:#FAF9F6;border:none;border-radius:12px;
    padding:11px 12px;cursor:pointer;font-family:inherit;margin-bottom:6px;}
  .picker-item .n{font-weight:700;font-size:13.5px;}
  .picker-item .m{font-size:11.5px;color:var(--muted);}
  .history-row{display:flex;justify-content:space-between;align-items:center;
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;font-size:12.5px;margin-bottom:7px;cursor:pointer;}
  .history-row .date{color:var(--muted);display:flex;align-items:center;gap:4px;}
  .history-row .amt.pay{color:var(--emerald);font-weight:700;}
  .customer-row{display:flex;justify-content:space-between;align-items:center;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);
    padding:13px;margin-bottom:8px;width:100%;text-align:right;cursor:pointer;
    font-family:inherit;color:inherit;box-shadow:var(--shadow);}
  .customer-row .left b{display:block;font-size:14px;}
  .customer-row .phone{font-size:10.5px;color:#B9BCB4;margin-top:2px;}
  .customer-row .right{text-align:left;}
  .customer-row .right .amt{font-weight:800;font-size:13.5px;}
  .customer-row .right .last{font-size:11px;color:var(--muted);margin-top:2px;}
  .customer-row .right .last.rose{color:var(--rose);}
  .customer-row .right .last.emerald{color:var(--emerald);}
  .customer-row .left,.customer-row .right{min-width:0;overflow-wrap:anywhere;}
  .customer-contact{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .whatsapp-link{display:block;text-align:center;text-decoration:none;margin-bottom:14px;}
  .invoice-row{font-family:inherit;width:100%;text-align:right;color:inherit;gap:10px;}
  .invoice-row .sub{color:var(--muted);}
  .history-row.static{cursor:default;gap:10px;overflow-wrap:anywhere;}
  .chip-select{display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 12px;cursor:pointer;font-size:14px;}
  .chip-select .placeholder{color:#B9BCB4;}
  .sort-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
  .sort-chip{flex-shrink:0;background:var(--card);border:1px solid var(--border);
    border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--muted);
    cursor:pointer;font-family:inherit;}
  .sort-chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  #bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:7px 0 9px;z-index:20;}
  #bottomnav button{background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:#B9BCB4;font-family:inherit;cursor:pointer;
    padding:5px 12px;border-radius:12px;}
  #bottomnav button.active{color:var(--teal);}
  #bottomnav .lbl{font-size:10px;font-weight:700;}

  #modal-root{position:fixed;inset:0;display:none;z-index:30;}
  #modal-root.open{display:block;}
  .overlay{position:absolute;inset:0;background:rgba(20,24,19,.45);}
  .sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;
    padding:16px 16px 28px;max-height:89vh;overflow-y:auto;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h2{font-size:16.5px;margin:0;font-weight:800;}
  .close-x{background:var(--chip);border:none;width:30px;height:30px;border-radius:99px;
    cursor:pointer;font-size:14px;color:var(--muted);}
  .back-x{background:var(--chip);border:none;padding:6px 12px;border-radius:99px;
    cursor:pointer;font-size:12px;color:var(--text);font-weight:700;font-family:inherit;}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--teal);font-weight:700;}
  canvas{max-width:100%;}
  .auth-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 20px);}
  .auth-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:24px 20px;box-shadow:var(--shadow);}
</style>
</head>
<body>
<div id="app">
  <div id="content"><div class="loading">جارِ التحميل...</div></div>
  <div id="bottomnav" style="display:none"></div>
  <div id="modal-root"><div class="overlay" data-action="close-modal"></div><div class="sheet" id="sheet-body"></div></div>
  <div id="save-error" style="display:none;position:fixed;bottom:76px;left:50%;transform:translateX(-50%);
    background:var(--rose);color:#fff;padding:9px 18px;border-radius:12px;font-size:12px;font-weight:700;
    z-index:40;max-width:88%;text-align:center;box-shadow:var(--shadow);">تعذر حفظ آخر تعديل، تحقق من الاتصال</div>
</div>

<script>
const LOW_STOCK = 5;
const CURRENCY = "د.ع";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = (n) => Math.round(n||0).toLocaleString("en-US");
const localDay = (date) => nowLocalInput(date).slice(0, 10);
const todayISO = () => localDay();
const esc = (s) => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowLocalInput = (iso) => {
  const d = iso ? new Date(iso) : new Date();
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const localInputToISO = (val) => val ? new Date(val).toISOString() : new Date().toISOString();

/* ---------------- SUPABASE / AUTH ---------------- */
// Only the publishable (anon) key belongs here. Never put a secret/service-role key in client code.
const SUPABASE_URL = "https://gufvmajnhcgonpirtnrt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_E67n8tWgQG6_CEjQkb1c7A_Cg16Az8K";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let authMode = "login"; // "login" | "signup"
let authError = "";
let authNotice = "";

async function initAuth(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s)=>{
    const wasSignedIn = !!session;
    session = s;
    if(session && !wasSignedIn){ loadData(); }
    else if(!session){
      state = { data:{ products:[], customers:[], sales:[], payments:[], expenses:null }, tab:"home", ready:false };
      renderAuth();
    }
  });
  if(session) loadData(); else renderAuth();
}

function renderAuth(){
  document.getElementById("bottomnav").style.display = "none";
  document.getElementById("content").innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 style="text-align:center;margin-bottom:4px;">الديون والمخزون</h1>
        <div style="text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:20px;">
          ${authMode==="login" ? "سجّل الدخول لمتابعة عملك" : "أنشئ حسابًا جديدًا"}
        </div>
        ${authError ? `<div class="notice">${esc(authError)}</div>` : ""}
        ${authNotice ? `<div class="notice success">${esc(authNotice)}</div>` : ""}
        <label class="field"><div class="field-label">البريد الإلكتروني</div><input class="in" id="auth-email" type="email" inputmode="email" autocomplete="email"></label>
        <label class="field"><div class="field-label">كلمة المرور</div><input class="in" id="auth-pass" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}"></label>
        <button class="btn btn-primary btn-block" id="auth-submit">${authMode==="login" ? "تسجيل الدخول" : "إنشاء حساب"}</button>
        <button class="link-btn" id="auth-toggle" style="display:block;margin:14px auto 0;">
          ${authMode==="login" ? "ليس لديك حساب؟ أنشئ حسابًا" : "لديك حساب؟ سجّل الدخول"}
        </button>
      </div>
    </div>
  `;
  document.getElementById("auth-toggle").onclick = ()=>{
    authMode = authMode==="login" ? "signup" : "login";
    authError = ""; authNotice = "";
    renderAuth();
  };
  document.getElementById("auth-submit").onclick = submitAuth;
  const passField = document.getElementById("auth-pass");
  passField.onkeydown = (e)=>{ if(e.key==="Enter") submitAuth(); };
}

async function submitAuth(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-pass").value;
  authError = ""; authNotice = "";
  if(!email || !password){ authError = "الرجاء إدخال البريد الإلكتروني وكلمة المرور"; renderAuth(); return; }
  if(password.length < 6){ authError = "كلمة المرور يجب ألا تقل عن 6 أحرف"; renderAuth(); return; }
  const btn = document.getElementById("auth-submit");
  btn.disabled = true; btn.textContent = "...";
  if(authMode==="login"){
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ authError = error.message; renderAuth(); return; }
  } else {
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ authError = error.message; renderAuth(); return; }
    if(!data.session){
      authMode = "login";
      authNotice = "تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتفعيل الحساب ثم سجّل الدخول.";
      renderAuth();
      return;
    }
  }
}

async function signOut(){
  await sb.auth.signOut();
}

function isSameDay(dateStr, ref){ return localDay(dateStr) === ref; }
function isWithinDays(dateStr, days){
  const first = new Date();
  first.setDate(first.getDate() - days + 1);
  const day = localDay(dateStr);
  return day >= localDay(first) && day <= todayISO();
}
function isSameMonth(dateStr, ref){
  return localDay(dateStr).slice(0, 7) === ref.slice(0, 7);
}
function fmtDate(dateStr){ return new Date(dateStr).toLocaleDateString("en-GB"); }
function fmtDateTime(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-GB") + " " + d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}

let state = { data: { products: [], customers: [], sales: [], payments: [], expenses: null }, tab: "home", ready: false };
let ui = {
  productQuery: "",
  cart: [], saleCustomerId: "", salePaid: "", saleDiscount: "0", saleDate: nowLocalInput(),
  saleDone: false, saleSaving: false, saleError: "", saleDraftId: null, editingSaleId: null,
  reportPeriod: "day",
  customerQuery: "", customerFilter: "all",
  invoiceQuery: "", confirmDeleteInvoiceId: null,
};
let charts = { trend: null, top: null };

/* ---------------- DATA LAYER ---------------- */

function diffById(prevArr, nextArr){
  const prevMap = new Map((prevArr||[]).map(x=>[x.id, x]));
  const nextMap = new Map((nextArr||[]).map(x=>[x.id, x]));
  const removed = [...prevMap.keys()].filter(id=>!nextMap.has(id));
  const changed = (nextArr||[]).filter(x=> prevMap.get(x.id) !== x);
  return { removed, changed };
}

function flashSaveError(){
  const el = document.getElementById("save-error");
  if(!el) return;
  el.style.display = "block";
  clearTimeout(flashSaveError._t);
  flashSaveError._t = setTimeout(()=>{ el.style.display = "none"; }, 3500);
}

async function syncCustomers(prevArr, nextArr, uid_){
  const { removed, changed } = diffById(prevArr, nextArr);
  if(removed.length){
    const { error } = await sb.from("customers").delete().in("id", removed);
    if(error) throw error;
  }
  if(changed.length){
    const rows = changed.map(c=>({
      id: c.id, user_id: uid_, name: c.name, phone: c.phone || "",
      location: c.location || "", note: c.note || "",
    }));
    const { error } = await sb.from("customers").upsert(rows);
    if(error) throw error;
  }
}

async function syncPayments(prevArr, nextArr, uid_){
  const { removed, changed } = diffById(prevArr, nextArr);
  if(removed.length){
    const { error } = await sb.from("payments").delete().in("id", removed);
    if(error) throw error;
  }
  if(changed.length){
    const rows = changed.map(p=>({
      id: p.id, user_id: uid_, customer_id: p.customerId || null, sale_id: p.saleId || null,
      amount: Number(p.amount)||0, date: p.date, note: p.note || "",
    }));
    const { error } = await sb.from("payments").upsert(rows);
    if(error) throw error;
  }
}

function productFromRow(p){
  return {
    id:p.id, name:p.name, code:p.code||"", buyPrice:Number(p.buy_price),
    sellPrice:Number(p.sell_price), imageUrl:p.image_url||"",
    qty:Number(p.qty), mainQty:Number(p.main_qty||0),
    mainDamagedQty:Number(p.main_damaged_qty||0), mainWornQty:Number(p.main_worn_qty||0),
    shopDamagedQty:Number(p.shop_damaged_qty||0), shopWornQty:Number(p.shop_worn_qty||0),
  };
}

function saleItemFromRow(it){
  return {productId:it.product_id, name:it.name, qty:Number(it.qty),
    sellPrice:Number(it.sell_price), buyPrice:Number(it.buy_price)};
}

function saleFromRow(s, items){
  return {id:s.id, date:s.date, customerId:s.customer_id, total:Number(s.total),
    discount:Number(s.discount), paid:Number(s.paid), items};
}

function paymentFromRow(p){
  return {id:p.id, customerId:p.customer_id, saleId:p.sale_id, amount:Number(p.amount),
    date:p.date, note:p.note||""};
}

function updateProducts(rows){
  const products = new Map(state.data.products.map(p=>[p.id,p]));
  for(const row of rows) products.set(row.id, productFromRow(row));
  state.data.products = [...products.values()].sort((a,b)=>a.name.localeCompare(b.name,"ar"));
}

async function loadRows(table, owner, sort){
  const rows = [];
  const pageSize = 500;
  for(let start = 0; ; start += pageSize){
    let query = sb.from(table).select("*").eq("user_id", owner);
    if(sort) query = query.order(sort);
    const { data, error } = await query.order("id").range(start, start + pageSize - 1);
    if(error) throw error;
    rows.push(...data);
    if(data.length < pageSize) return rows;
  }
}

async function loadData(){
  try{
    const uid_ = session.user.id;
    const [products, customers, sales, payments, items, expenses] = await Promise.all([
      loadRows("products", uid_, "name"),
      loadRows("customers", uid_, "name"),
      loadRows("sales", uid_, "date"),
      loadRows("payments", uid_, "date"),
      loadRows("sale_items", uid_),
      loadRows("expenses", uid_).catch(error=>{
        console.error("تعذر تحميل المصاريف", error);
        return null;
      }),
    ]);
    if(session?.user.id !== uid_) return;

    const itemsBySale = {};
    items.forEach(it=>{
      (itemsBySale[it.sale_id] ||= []).push(saleItemFromRow(it));
    });

    state.data = {
      products: products.map(productFromRow),
      customers: customers.map(c=>({
        id: c.id, name: c.name, phone: c.phone||"", location: c.location||"", note: c.note||"",
      })),
      sales: sales.map(s=>saleFromRow(s, itemsBySale[s.id]||[])),
      payments: payments.map(paymentFromRow),
      expenses: expenses?.map(e=>({id:e.id, name:e.name, amount:Number(e.amount), date:e.date})) ?? null,
    };
  }catch(e){
    console.error("تعذر تحميل البيانات", e);
    state.data = { products:[], customers:[], sales:[], payments:[], expenses:null };
    flashSaveError();
  }
  state.ready = true;
  render();
}

async function persistCustomers(customers){

  state.data.customers = customers;

  const owner = session?.user.id;

  try{

  }
}

function paymentSummary(){
  const bySale = new Map();
  const byCustomer = new Map();
  const salesByCustomer = new Map();
  const receipts = [...state.data.payments];

  for(const sale of state.data.sales){
    bySale.set(sale.id, {paid:0, payments:[]});
    if(sale.customerId){
      if(!salesByCustomer.has(sale.customerId)) salesByCustomer.set(sale.customerId, []);
      salesByCustomer.get(sale.customerId).push(sale);
    }
  }

  const latestFirst = (a,b)=>new Date(b.date)-new Date(a.date);
  function creditInvoice(invoice, payment, amount){
    invoice.paid += amount;
    invoice.payments.push({...payment, amount});
  }

  for(const payment of receipts){
    const invoice = bySale.get(payment.saleId);
    if(invoice) creditInvoice(invoice, payment, payment.amount);
  }

  // Some older sales only store the amount paid in the sale itself.
  for(const sale of state.data.sales){
    const invoice = bySale.get(sale.id);
    if(!invoice.payments.length && sale.paid>0){
      const receipt = {saleId:sale.id, customerId:sale.customerId, amount:sale.paid, date:sale.date};
      receipts.push(receipt);
      creditInvoice(invoice, receipt, receipt.amount);
    }
  }

  const receiptsByCustomer = new Map();
  for(const receipt of receipts.sort(latestFirst)){
    if(!receipt.customerId) continue;
    if(!receiptsByCustomer.has(receipt.customerId)) receiptsByCustomer.set(receipt.customerId, []);
    receiptsByCustomer.get(receipt.customerId).push(receipt);
  }

  for(const customer of state.data.customers){
    const sales = (salesByCustomer.get(customer.id) || []).sort((a,b)=>latestFirst(b,a));
    const payments = receiptsByCustomer.get(customer.id) || [];
    const charged = sales.reduce((sum,sale)=>sum+sale.total,0);
    const paid = payments.reduce((sum,payment)=>sum+payment.amount,0);
    const remaining = Math.max(charged-paid,0);
    let status = "بلا مبيعات";
    if(charged>0) status = remaining===0 ? "مدفوع" : paid>0 ? "دفع جزئي" : "غير مدفوع";
    byCustomer.set(customer.id, {sales, payments, charged, paid, remaining, status});

    // Account payments without an invoice settle the oldest open invoice first.
    const accountPayments = payments.filter(p=>!p.saleId).reverse();
    let invoiceIndex = 0;
    for(const payment of accountPayments){
      let unallocated = payment.amount;
      while(unallocated>0 && invoiceIndex<sales.length){
        const sale = sales[invoiceIndex];
        const invoice = bySale.get(sale.id);
        const due = Math.max(sale.total-invoice.paid,0);
        const amount = Math.min(unallocated,due);
        if(amount>0) creditInvoice(invoice,payment,amount);
        unallocated -= amount;
        if(amount===due) invoiceIndex++;
      }
    }
  }

  for(const invoice of bySale.values()) invoice.payments.sort(latestFirst);
  return {bySale, byCustomer, receipts};
}

function debtByCustomer(){
  return Object.fromEntries(paymentSummary().byCustomer);
}

function openStockProduct(id, confirmDelete=false){
  const product = state.data.products.find(p=>p.id===id);
  if(!product) return;
  openSheet(product.name, `
    ${stockCounts(product, true)}
    <div class="summary-card">
      <div class="kv"><span class="k">سعر الشراء</span><span class="v">${fmt(product.buyPrice)} ${CURRENCY}</span></div>
      <div class="kv"><span class="k">سعر البيع</span><span class="v">${fmt(product.sellPrice)} ${CURRENCY}</span></div>
    </div>
    <div class="grid2 stock-actions">
      <button class="btn btn-secondary" id="receive-stock">إضافة كمية</button>
      <button class="btn btn-primary" id="transfer-stock" ${product.mainQty<1?"disabled":""}>نقل للمحل</button>
      <button class="btn btn-secondary" id="flag-stock" ${product.mainQty<1&&product.qty<1?"disabled":""}>تالف / تعبان</button>
      <button class="btn btn-ghost" id="edit-stock-product">تعديل المنتج</button>
    </div>
    <div class="stock-remove">
      <button class="${confirmDelete?"btn btn-danger":"link-btn"}" id="delete-stock-product">${confirmDelete?"تأكيد حذف المنتج":"حذف المنتج"}</button>
    </div>
  `);
  document.getElementById("receive-stock").onclick = ()=>openStockMovement(product,"receive");
  document.getElementById("transfer-stock").onclick = ()=>openStockMovement(product,"transfer");
  document.getElementById("flag-stock").onclick = ()=>openStockMovement(product,"flag");
  document.getElementById("edit-stock-product").onclick = ()=>openProductForm(product);
  document.getElementById("delete-stock-product").onclick = async (event)=>{
    if(!confirmDelete){ openStockProduct(id,true); return; }
    const owner = session?.user.id;
    if(!owner) return;
    const button = event.currentTarget;
    button.disabled = true;
    try{
      const {error} = await sb.from("products").delete().eq("id",id).eq("user_id",owner);
      if(error) throw error;
      if(session?.user.id !== owner) return;
      state.data.products = state.data.products.filter(p=>p.id!==id);
      if(button.isConnected) closeModal();
      render();
    }catch(error){
      console.error("تعذّر حذف المنتج",error);
      flashSaveError();
      button.disabled = false;
    }
  };
}

function openProductForm(product){
  const p = product || {id:uid(), name:"", code:"", buyPrice:"", sellPrice:"", mainQty:"", imageUrl:""};
  openSheet(product?"تعديل منتج":"منتج جديد", `
    <form id="product-form">
      <label class="field"><div class="field-label">الاسم</div><input class="in" id="f-name" value="${esc(p.name)}" required></label>
      <label class="field"><div class="field-label">الكود (اختياري)</div><input class="in" id="f-code" value="${esc(p.code)}"></label>
      <div class="two-col">
        <label class="field"><div class="field-label">سعر الشراء</div><input class="in" id="f-buy" type="number" inputmode="decimal" step="any" value="${esc(p.buyPrice)}"></label>
        <label class="field"><div class="field-label">سعر البيع</div><input class="in" id="f-sell" type="number" inputmode="decimal" step="any" value="${esc(p.sellPrice)}" required></label>
      </div>
      <label class="field"><div class="field-label">الكمية في المخزن الرئيسي</div><input class="in" id="f-qty" type="number" inputmode="numeric" min="0" step="1" max="9007199254740991" value="${esc(p.mainQty)}" required></label>
      ${product ? `<label class="field"><div class="field-label">الكمية السليمة في المحل</div>
        <input class="in" id="f-shop-qty" type="number" inputmode="numeric" min="0" step="any" max="9007199254740991" value="${esc(p.qty)}" required></label>` : ""}
      <label class="field"><div class="field-label">رابط صورة (اختياري)</div><input class="in" id="f-img" placeholder="https://..." value="${esc(p.imageUrl)}"></label>
      <div class="notice" id="product-form-error" role="alert" hidden></div>
      <button class="btn btn-primary btn-block" id="save-product">حفظ</button>
    </form>
  `);
  const form = document.getElementById("product-form");
  const nameInput = document.getElementById("f-name");
  const button = document.getElementById("save-product");
  const notice = document.getElementById("product-form-error");
  nameInput.oninput = ()=>nameInput.setCustomValidity("");
  form.onsubmit = async (event)=>{
    event.preventDefault();
    if(button.disabled) return;
    const owner = session?.user.id;
    const name = nameInput.value.trim();
    if(!name){
      nameInput.setCustomValidity("أدخل اسم المنتج");
      nameInput.reportValidity();
      return;
    }
    const mainQty = Number(document.getElementById("f-qty").value);
    if(!owner || !Number.isSafeInteger(mainQty) || mainQty<0) return;
    const fields = {
      name, code:document.getElementById("f-code").value.trim(),
      buy_price:Number(document.getElementById("f-buy").value)||0,
      sell_price:Number(document.getElementById("f-sell").value),
      image_url:document.getElementById("f-img").value.trim(),
    };
    button.disabled = true;
    notice.hidden = true;
    try{
      let result;
      if(product){
        const shopQty = Number(document.getElementById("f-shop-qty").value);
        if(!Number.isFinite(shopQty) || shopQty<0) return;
        const mainChanged = mainQty!==p.mainQty;
        const shopChanged = shopQty!==p.qty;
        if(mainChanged) fields.main_qty = mainQty;
        if(shopChanged) fields.qty = shopQty;
        let query = sb.from("products").update(fields).eq("id",p.id).eq("user_id",owner);
        if(mainChanged) query = query.eq("main_qty",p.mainQty);
        if(shopChanged) query = query.eq("qty",p.qty);
        result = await query.select("*").maybeSingle();
      }else{
        result = await sb.from("products").upsert({
          id:p.id, user_id:owner, ...fields, main_qty:mainQty, qty:0
        },{onConflict:"id",ignoreDuplicates:true}).select("*").maybeSingle();
      }
      if(result.error) throw result.error;
      if(!result.data){
        const current = await sb.from("products").select("*").eq("user_id",owner).eq("id",p.id).single();
        if(current.error) throw current.error;
        if(session?.user.id !== owner) return;
        updateProducts([current.data]);
        render();
        if(!form.isConnected) return;
        if(product){
          notice.textContent = "تغيّر رصيد المخزن. افتح الصنف مرة ثانية حتى تظهر الكمية الجديدة.";
          notice.hidden = false;
          return;
        }
      }else{
        if(session?.user.id !== owner) return;
        updateProducts([result.data]);
        render();
      }
      if(form.isConnected && document.getElementById("modal-root").classList.contains("open")) openStockProduct(p.id);
    }catch(error){
      console.error("تعذّر حفظ المنتج",error);
      notice.textContent = "تعذّر حفظ المنتج. جرّب مرة ثانية.";
      notice.hidden = false;
    }finally{
      button.disabled = false;
    }
  };
}

function openStockMovement(product, movement){
  const titles = {receive:"إضافة كمية للرئيسي",transfer:"نقل من الرئيسي للمحل",flag:"تسجيل تالف أو تعبان"};
  const flag = movement==="flag";
  const source = product.mainQty>=1 ? "main" : "shop";
  openSheet(titles[movement], `
    <button class="back-x" id="return-stock-product" style="margin-bottom:12px">‹ ${esc(product.name)}</button>
    <form id="stock-movement-form">
      ${flag ? `
      <div class="two-col">
        <label class="field"><div class="field-label">المخزن</div>
          <select class="in" id="stock-source">
            <option value="main" ${source==="main"?"selected":""}>الرئيسي</option>
            <option value="shop" ${source==="shop"?"selected":""}>المحل</option>
          </select>
        </label>
        <label class="field"><div class="field-label">الحالة</div>
          <select class="in" id="stock-condition"><option value="damaged">تالف</option><option value="worn">تعبان</option></select>
        </label>
      </div>` : ""}
      <label class="field"><div class="field-label" id="stock-quantity-label">عدد القطع</div>
        <input class="in" id="stock-quantity" type="number" inputmode="numeric" min="1" step="1" required>
      </label>
      <div class="notice" id="stock-movement-error" role="alert" hidden></div>
      <button class="btn btn-primary btn-block" id="save-stock-movement">${movement==="transfer"?"نقل الكمية":"حفظ الكمية"}</button>
    </form>
  `);
  const form = document.getElementById("stock-movement-form");
  const input = document.getElementById("stock-quantity");
  const warehouseInput = document.getElementById("stock-source");
  const submit = document.getElementById("save-stock-movement");
  const notice = document.getElementById("stock-movement-error");
  const quantityLabel = document.getElementById("stock-quantity-label");
  const warehouse = ()=>warehouseInput?.value || "main";
  function updateLimit(){
    const available = warehouse()==="main" ? product.mainQty : product.qty;
    input.max = movement==="receive" ? "9007199254740991" : String(Math.floor(available));
    if(movement!=="receive") quantityLabel.textContent = `عدد القطع · السليم المتاح ${available.toLocaleString("en-US")}`;
  }
  updateLimit();
  if(warehouseInput) warehouseInput.onchange = updateLimit;
  document.getElementById("return-stock-product").onclick = ()=>openStockProduct(product.id);
  let request = null;
  form.onsubmit = async (event)=>{
    event.preventDefault();
    const owner = session?.user.id;
    const units = Number(input.value);
    if(!owner || submit.disabled || !Number.isSafeInteger(units) || units<1 || units>Number(input.max)) return;
    const action = flag ? document.getElementById("stock-condition").value : movement;
    const location = warehouse();
    if(!request || request.p_units!==units || request.p_action!==action || request.p_warehouse!==location){
      request = {p_id:uid(), p_product_id:product.id, p_action:action, p_warehouse:location, p_units:units};
    }
    submit.disabled = true;
    notice.hidden = true;
    try{
      const {data,error} = await sb.rpc("move_product_stock",request);
      if(error) throw error;
      if(session?.user.id !== owner) return;
      updateProducts(Array.isArray(data) ? data : [data]);
      render();
      if(form.isConnected && document.getElementById("modal-root").classList.contains("open")) openStockProduct(product.id);
    }catch(error){
      console.error("تعذّر تحديث المخزون",error);
      notice.textContent = error.code==="P0001" ? error.message : "تعذّر تحديث المخزون. جرّب مرة ثانية.";
      notice.hidden = false;
    }finally{

/* ---------------- SALE ---------------- */
function saleProductMap(){ return Object.fromEntries(state.data.products.map(p=>[p.id,p])); }

// available stock for a product while editing an existing sale (old reserved qty returns to pool)
function availableQty(productId){
  const p = saleProductMap()[productId];
  if(!p) return 0;
  let base = p.qty;
  if(ui.editingSaleId){
    const oldSale = state.data.sales.find(s=>s.id===ui.editingSaleId);
    const oldItem = oldSale && oldSale.items.find(it=>it.productId===productId);
    if(oldItem) base += oldItem.qty;
  }
  return base;
}

  const pm = saleProductMap();

  const discount = Math.max(Number(ui.saleDiscount)||0,0);
  const total = Math.max(rawTotal - discount, 0);
  const paidNum = Number(ui.salePaid)||0;
  const remaining = total - paidNum;
  const stockOk = ui.cart.every(it=>it.qty<=availableQty(it.productId));
  const canSell = !ui.saleSaving && ui.cart.length>0 && stockOk && (remaining<=0 || ui.saleCustomerId!=="");
  const selectedCustomer = ui.saleCustomerId ? state.data.customers.find(c=>c.id===ui.saleCustomerId) : null;

        <div class="kv"><span class="k">الإجمالي النهائي</span><span class="v">${fmt(total)} ${CURRENCY}</span></div>

    document.querySelectorAll("[data-qty-plus]").forEach(b=>b.onclick=()=>changeCartQty(b.dataset.qtyPlus,1));
    document.querySelectorAll("[data-qty-input]").forEach(inp=>{
      inp.onchange = (e)=>{
        const id = e.target.dataset.qtyInput;
        const val = Math.max(parseInt(e.target.value)||0, 0);
        ui.cart = val===0 ? ui.cart.filter(it=>it.productId!==id) : ui.cart.map(it=>it.productId===id?{...it,qty:val}:it);

function changeCartQty(id, delta){
  const max = availableQty(id);
  ui.cart = ui.cart.map(it=>it.productId===id?{...it, qty:Math.min(it.qty+delta, Math.max(max, it.qty+delta))}:it).filter(it=>it.qty>0);
  renderSale();
}

  ui.cart = []; ui.saleCustomerId=""; ui.salePaid=""; ui.saleDiscount="0";
  ui.saleDate = nowLocalInput(); ui.editingSaleId = null;

}

async function confirmSale(){
  const owner = session?.user.id;
  if(!owner || ui.saleSaving) return;
  const editing = Boolean(ui.editingSaleId);
  const saleId = ui.editingSaleId || (ui.saleDraftId ||= uid());
  const items = ui.cart.map(item=>({product_id:item.productId, units:item.qty}));
  const content = document.getElementById("content");
  const button = document.getElementById("confirm-sale");
  ui.saleSaving = true;
  ui.saleError = "";
  button.disabled = true;
  button.textContent = "جارِ حفظ الفاتورة…";
  content.inert = true;
  try{
    const {data,error} = await sb.rpc("save_inventory_sale",{
      p_id:saleId, p_editing:editing, p_customer_id:ui.saleCustomerId||null,
      p_date:localInputToISO(ui.saleDate), p_discount:Math.max(Number(ui.saleDiscount)||0,0),
      p_paid:Math.max(Number(ui.salePaid)||0,0), p_items:items,
    });
    if(error) throw error;
    if(session?.user.id !== owner) return;
    const invoice = saleFromRow(data.sale, data.items.map(saleItemFromRow));
    updateProducts(data.products);
    state.data.sales = [...state.data.sales.filter(s=>s.id!==saleId),invoice];
    state.data.payments = [...state.data.payments.filter(p=>p.saleId!==saleId),...data.payments.map(paymentFromRow)];
    resetSaleForm();
    if(editing && state.tab==="sale") state.tab = "reports";
    if(!editing && state.tab==="sale"){
      ui.saleDone = true;
      setTimeout(()=>{ ui.saleDone=false; if(session && state.tab==="sale") render(); },1600);
    }
  }catch(error){
    console.error("تعذّر حفظ الفاتورة",error);
    if(session?.user.id === owner){
      ui.saleError = error.code==="P0001" ? error.message : "تعذّر حفظ الفاتورة. جرّب مرة ثانية.";
      if(error.code==="P0001" && items.length){
        const result = await sb.from("products").select("*").eq("user_id",owner)
          .in("id",items.map(item=>item.product_id).filter(Boolean));
        if(!result.error && session?.user.id === owner) updateProducts(result.data);
      }
    }
  }finally{
    ui.saleSaving = false;
    content.inert = false;
    if(session?.user.id === owner) render();
  }
}

function whatsappPhone(phone){
  const compact = (phone || "")
    .replace(/[٠-٩]/g, digit=>"٠١٢٣٤٥٦٧٨٩".indexOf(digit))
    .replace(/[۰-۹]/g, digit=>"۰۱۲۳۴۵۶۷۸۹".indexOf(digit))
    .replace(/[\s().\-\u061c\u200e\u200f]/g, "");
  const international = compact.startsWith("+") || compact.startsWith("00");
  const number = compact.replace(/^(?:\+|00)/, "");

  if(number.startsWith("964")){
    const mobile = number.slice(3).replace(/^0/, "");
    return /^7\d{9}$/.test(mobile) ? "964"+mobile : "";
  }
  if(international) return /^[1-9]\d{6,14}$/.test(number) ? number : "";
  if(/^0?7\d{9}$/.test(number)) return "964"+number.replace(/^0/, "");
  return "";
}

function customerWhatsAppLink(phone, name, account, sales){
  const purchases = sales.map(sale=>{
    const products = sale.items.map(item=>`• ${item.name} × ${item.qty}`);
    if(!products.length) products.push("تفاصيل الأصناف غير مسجّلة.");
    return [`تاريخ الشراء: ${fmtDate(sale.date)}`, ...products].join("\n");
  });
  const message = [
    "السلام عليكم ورحمة الله وبركاته",
    `هلا ${name}، هذا كشف حساب مشترياتك:`,
    "",
    `إجمالي المشتريات: ${fmt(account.charged)} ${CURRENCY}`,
    `المبلغ اللي سدّدته: ${fmt(account.paid)} ${CURRENCY}`,
    `المبلغ المتبقي عليك: ${fmt(account.remaining)} ${CURRENCY}`,
    "",
    purchases.length ? purchases.join("\n\n") : "ماكو مشتريات مسجّلة.",
    "",
    "شكراً إلك."
  ].join("\n");
  return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
}

      </button>`).join("") : '<div class="empty">لا توجد فواتير.</div>'}
    <div class="section-title">آخر الدفعات</div>
    ${paymentRows(d.payments)}
  `);
  document.getElementById("edit-customer-phone").onclick = ()=>openCustomerPhoneForm(c);
  const form = document.getElementById("customer-payment-form");
  if(form) form.onsubmit = async (event)=>{
    event.preventDefault();
    const amt = Number(document.getElementById("pay-amount").value);
    if(!Number.isSafeInteger(amt) || amt<1 || amt>d.remaining || !session) return;
    const btn = document.getElementById("record-payment");
    btn.disabled = true;
    const owner = session.user.id;
    const payment = {id:uid(), customerId:id, amount:amt, date:new Date().toISOString(), note:"دفعة يدوية"};
    try{
      await syncPayments([], [payment], owner);
      if(session?.user.id !== owner) return;
      state.data.payments = [...state.data.payments, payment];
      render();
      if(form.isConnected && document.getElementById("modal-root").classList.contains("open")) openCustomerDetail(id);
    }catch(error){
      console.error("تعذر تسجيل الدفعة",error);
      flashSaveError();
      btn.disabled = false;
    }
  };
  document.querySelectorAll("[data-view-sale]").forEach(row=>row.onclick=()=>openInvoiceDetail(row.dataset.viewSale,id));
}

function paymentRows(payments){
  return payments.length ? payments.map(p=>`
    <div class="history-row static"><span class="date">${fmtDateTime(p.date)}</span>
    <span class="amt pay">${fmt(p.amount)} ${CURRENCY}</span></div>`).join("") : '<div class="empty">لا توجد دفعات.</div>';
}

/* ---------------- INVOICES ---------------- */
function openInvoiceList(){ renderInvoiceListSheet(""); }
function renderInvoiceListSheet(query, keepFocus=false){
  ui.invoiceQuery = query;
  const {bySale, byCustomer} = paymentSummary();
  const cmap = Object.fromEntries(state.data.customers.map(c=>[c.id,c.name]));
  const list = [...state.data.sales]
    .filter(s=>{
      const cname = s.customerId ? (cmap[s.customerId]||"") : "نقدي";
      return cname.includes(query);
    })
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  openSheet("كل الفواتير", `
    <div class="search"><span class="ic">🔍</span><input class="in" id="invoice-search" placeholder="بحث باسم العميل..." value="${esc(query)}" style="padding-right:38px"></div>
    ${list.length===0 ? '<div class="empty">لا توجد فواتير بعد.</div>' :
      list.map(s=>{
        const invoice = bySale.get(s.id);
        const last = invoice.payments[0];
        const customer = byCustomer.get(s.customerId);
        return `<button class="history-row invoice-row" data-view-sale="${esc(s.id)}">
          <span class="grow"><b>${s.customerId?esc(cmap[s.customerId]||"—"):"نقدي"}</b>
            <span class="sub" style="display:block">${fmtDateTime(s.date)}</span>
            <span class="sub" style="display:block">${last ? `آخر دفعة ${fmt(last.amount)} ${CURRENCY} · ${fmtDate(last.date)}` : "لا توجد دفعات"}</span>
          </span>
          <span style="text-align:left">${fmt(s.total)} ${CURRENCY}
            <span class="sub" style="display:block">متبقي الفاتورة ${fmt(Math.max(s.total-invoice.paid,0))}</span>
            ${customer ? `<span class="sub" style="display:block">متبقي العميل ${fmt(customer.remaining)}</span>` : ""}
          </span>
        </button>`;
      }).join("")}
  `);
  const search = document.getElementById("invoice-search");
  search.oninput = ()=>renderInvoiceListSheet(search.value,true);
  if(keepFocus){
    search.focus();
    search.setSelectionRange(search.value.length,search.value.length);
  }
  document.querySelectorAll("[data-view-sale]").forEach(row=>row.onclick=()=>openInvoiceDetail(row.dataset.viewSale));
}

function openInvoiceDetail(saleId, fromCustomer){
  const s = state.data.sales.find(x=>x.id===saleId);
  if(!s) return;
  const canEdit = s.items.every(it=>state.data.products.some(p=>p.id===it.productId));
  const customer = state.data.customers.find(c=>c.id===s.customerId);
  const {bySale, byCustomer} = paymentSummary();
  const invoice = bySale.get(saleId);
  const remaining = Math.max(s.total-invoice.paid,0);
  openSheet("تفاصيل الفاتورة", `
    <button class="back-x" id="back-to-list" style="margin-bottom:12px">${fromCustomer ? "‹ رجوع للعميل" : "‹ رجوع لكل الفواتير"}</button>
    <div class="summary-card">
      <div class="kv"><span class="k">التاريخ</span><span class="v">${fmtDateTime(s.date)}</span></div>
      <div class="kv"><span class="k">العميل</span><span class="v">${customer?esc(customer.name):"نقدي"}</span></div>
    </div>
    <div class="section-title" style="margin-top:0">المنتجات</div>
    ${s.items.map(it=>`<div class="history-row static"><span>${esc(it.name)} × ${fmt(it.qty)}</span><span>${fmt(it.sellPrice*it.qty)} ${CURRENCY}</span></div>`).join("")}
    <div class="summary-card" style="margin-top:12px">
      ${s.discount>0?`<div class="kv"><span class="k">الخصم</span><span class="v">- ${fmt(s.discount)} ${CURRENCY}</span></div>`:""}
      <div class="kv"><span class="k">إجمالي الفاتورة</span><span class="v">${fmt(s.total)} ${CURRENCY}</span></div>
      <div class="kv"><span class="k">المدفوع للفاتورة</span><span class="v">${fmt(invoice.paid)} ${CURRENCY}</span></div>
      <div class="kv"><span class="k">متبقي الفاتورة</span><span class="v ${remaining>0?"rose":"emerald"}">${fmt(remaining)} ${CURRENCY}</span></div>
      ${customer ? `<div class="kv"><span class="k">متبقي العميل</span><span class="v">${fmt(byCustomer.get(customer.id).remaining)} ${CURRENCY}</span></div>` : ""}
    </div>
    <div class="section-title">دفعات الفاتورة</div>
    ${paymentRows(invoice.payments)}
    ${canEdit ? "" : '<div class="notice">بعض أصناف الفاتورة محذوفة من المخزون.</div>'}
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-secondary" style="flex:1" id="edit-invoice" ${canEdit?"":"disabled"}>تعديل الفاتورة</button>
      ${ui.confirmDeleteInvoiceId===saleId
        ? `<button class="btn btn-danger" style="flex:1" id="confirm-del-invoice">اضغط للتأكيد</button>`
        : `<button class="btn btn-ghost" style="flex:1" id="ask-del-invoice">حذف الفاتورة</button>`}
    </div>
  `);
  document.getElementById("back-to-list").onclick = ()=>{
    ui.confirmDeleteInvoiceId = null;
    if(fromCustomer) openCustomerDetail(fromCustomer);
    else renderInvoiceListSheet(ui.invoiceQuery);
  };
  document.getElementById("edit-invoice").onclick = ()=>editInvoice(saleId);
  const askBtn = document.getElementById("ask-del-invoice");
  if(askBtn) askBtn.onclick = ()=>{ ui.confirmDeleteInvoiceId=saleId; openInvoiceDetail(saleId, fromCustomer); };
  const confirmBtn = document.getElementById("confirm-del-invoice");
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    const owner = session?.user.id;
    if(!owner || confirmBtn.disabled) return;
    confirmBtn.disabled = true;
    try{
      const {data,error} = await sb.rpc("delete_inventory_sale",{
        p_id:saleId, p_product_ids:s.items.map(item=>item.productId).filter(Boolean),
      });
      if(error) throw error;
      if(session?.user.id !== owner) return;
      updateProducts(data);
      state.data.sales = state.data.sales.filter(x=>x.id!==saleId);
      state.data.payments = state.data.payments.filter(p=>p.saleId!==saleId);
      ui.confirmDeleteInvoiceId = null;
      if(confirmBtn.isConnected) closeModal();
      render();
    }catch(error){
      console.error("تعذّر حذف الفاتورة",error);
      flashSaveError();
      confirmBtn.disabled = false;
    }
  };
}

function editInvoice(saleId){
  const s = state.data.sales.find(x=>x.id===saleId);
  if(!s) return;
  ui.editingSaleId = saleId;
  ui.saleError = "";
  ui.cart = s.items.map(it=>({productId:it.productId, qty:it.qty}));
  ui.saleCustomerId = s.customerId || "";
  ui.salePaid = String(s.paid);
  ui.saleDiscount = String(s.discount||0);
  ui.saleDate = nowLocalInput(s.date);
  closeModal();
  state.tab = "sale";
  render();
}

/* ---------------- REPORTS ---------------- */
function renderReports(){
  const period = ui.reportPeriod;
  const inPeriod = (dateStr)=>{
    if(period==="day") return isSameDay(dateStr, todayISO());
    if(period==="week") return isWithinDays(dateStr, 7);
    if(period==="month") return isSameMonth(dateStr, todayISO());
    return true;
  };
  const sales = state.data.sales.filter(s=>inPeriod(s.date));
  const totalSales = sales.reduce((a,s)=>a+s.total,0);
  const {byCustomer, receipts} = paymentSummary();
  const collected = receipts.filter(p=>inPeriod(p.date)).reduce((sum,p)=>sum+p.amount,0);
  const expenses = state.data.expenses?.filter(e=>inPeriod(e.date))
    .sort((a,b)=>new Date(b.date)-new Date(a.date)) ?? null;
  const spent = expenses?.reduce((sum,e)=>sum+e.amount,0);
  const totalProfit = sales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+(it.sellPrice-it.buyPrice)*it.qty,0)-(s.discount||0),0);
  const productCount = {};
  sales.forEach(s=>s.items.forEach(it=>{ productCount[it.name]=(productCount[it.name]||0)+it.qty; }));
  const sortedProducts = Object.entries(productCount).sort((a,b)=>b[1]-a[1]);
  const topProduct = sortedProducts[0] ? `${sortedProducts[0][0]} (${sortedProducts[0][1]})` : "—";

  const cmap = Object.fromEntries(state.data.customers.map(c=>[c.id,c.name]));
  const topDebtorEntry = [...byCustomer].sort((a,b)=>b[1].remaining-a[1].remaining)[0];
  const topDebtor = (topDebtorEntry && topDebtorEntry[1].remaining>0) ? cmap[topDebtorEntry[0]] : "لا يوجد";
  const totalDebt = [...byCustomer.values()].reduce((a,x)=>a+x.remaining,0);

  // last 7 days trend data
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = localDay(d);
    const total = state.data.sales.filter(s=>isSameDay(s.date,iso)).reduce((a,s)=>a+s.total,0);
    days.push({ label: d.toLocaleDateString("ar-EG",{weekday:"short"}), total });
  }
  const topProductsChartData = sortedProducts.slice(0,5);

  document.getElementById("content").innerHTML = `
    <div class="topbar"><h1>التقارير</h1><button class="link-btn" id="open-invoices">كل الفواتير ›</button></div>
    <div class="period-tabs">
      <button data-period="day" class="${period==='day'?'active':''}">اليوم</button>
      <button data-period="week" class="${period==='week'?'active':''}">هذا الأسبوع</button>
      <button data-period="month" class="${period==='month'?'active':''}">هذا الشهر</button>
      <button data-period="all" class="${period==='all'?'active':''}">الكل</button>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="stat-box"><div class="val">${fmt(totalSales)} ${CURRENCY}</div><div class="lbl">إجمالي الإيرادات</div></div>
      <div class="stat-box"><div class="val">${fmt(collected)} ${CURRENCY}</div><div class="lbl">المبالغ المحصّلة</div></div>
      <div class="stat-box"><div class="val">${expenses ? fmt(spent)+" "+CURRENCY : "—"}</div><div class="lbl">المصاريف</div></div>
      <div class="stat-box"><div class="val">${expenses ? fmt(collected-spent)+" "+CURRENCY : "—"}</div><div class="lbl">المحصّل بعد المصاريف</div></div>
    </div>
    <div class="section-title">المصاريف ${expenses ? '<button class="btn btn-secondary" id="add-expense">+ مصروف</button>' : ""}</div>
    ${!expenses ? '<div class="notice">تعذّر تحميل المصاريف. حدّث الصفحة للمحاولة مرة ثانية.</div>' :
      expenses.length ? expenses.map(e=>`<div class="history-row static"><span class="grow"><b>${esc(e.name)}</b><span class="sub" style="display:block">${fmtDate(e.date)}</span></span><span class="amt">${fmt(e.amount)} ${CURRENCY}</span></div>`).join("") :
      '<div class="empty">لا توجد مصاريف بالفترة المحددة.</div>'}
    <div class="section-title">ملخّص المبيعات</div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="stat-box"><div class="val">${fmt(totalProfit)} ${CURRENCY}</div><div class="lbl">ربح البيع قبل المصاريف</div></div>
      <div class="stat-box"><div class="val small">${esc(topProduct)}</div><div class="lbl">أكثر منتج مبيعًا</div></div>
      <div class="stat-box"><div class="val small">${esc(topDebtor)}</div><div class="lbl">أكثر عميل عليه دين</div></div>
    </div>
    <div class="chart-card"><div class="ct">اتجاه المبيعات آخر 7 أيام</div><canvas id="trend-chart" height="160"></canvas></div>
    <div class="chart-card"><div class="ct">أكثر المنتجات مبيعًا (${{day:"اليوم",week:"هذا الأسبوع",month:"هذا الشهر",all:"كل الفترات"}[period]})</div>
      ${topProductsChartData.length===0 ? '<div class="empty">لا توجد مبيعات في هذه الفترة بعد.</div>' : '<canvas id="top-products-chart" height="180"></canvas>'}
    </div>
    <div class="summary-card">
      <div class="kv"><span class="k">إجمالي الديون المستحقة (كل الفترات)</span><span class="v" style="color:var(--rose)">${fmt(totalDebt)} ${CURRENCY}</span></div>
    </div>
  `;
  document.getElementById("open-invoices").onclick = openInvoiceList;
  const addExpense = document.getElementById("add-expense");
  if(addExpense) addExpense.onclick = openExpenseForm;
  document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{ ui.reportPeriod=b.dataset.period; renderReports(); });

  if(charts.trend) charts.trend.destroy();
  const trendCtx = document.getElementById("trend-chart");
  charts.trend = new Chart(trendCtx, {
    type: "bar",
    data: { labels: days.map(d=>d.label), datasets: [{ data: days.map(d=>d.total), backgroundColor: "#0E6B5C", borderRadius: 6, maxBarThickness: 28 }] },
    options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, grid:{color:"#EAE7E0"} }, x:{ grid:{display:false} } } }
  });

  if(charts.top) charts.top.destroy();
  if(topProductsChartData.length>0){
    const topCtx = document.getElementById("top-products-chart");
    charts.top = new Chart(topCtx, {
      type: "bar",
      data: { labels: topProductsChartData.map(p=>p[0]), datasets: [{ data: topProductsChartData.map(p=>p[1]), backgroundColor: "#0E9A6E", borderRadius: 6, maxBarThickness: 22 }] },
      options: { indexAxis: "y", plugins:{legend:{display:false}}, scales:{ x:{ beginAtZero:true, grid:{color:"#EAE7E0"} }, y:{ grid:{display:false} } } }
    });
  }
}

function openExpenseForm(){
  const expenseId = crypto.randomUUID();
  openSheet("إضافة مصروف", `
    <form id="expense-form">
      <label class="field"><div class="field-label">اسم المصروف</div><input class="in" id="expense-name" maxlength="120" required></label>
      <label class="field"><div class="field-label">المبلغ (د.ع)</div><input class="in" id="expense-amount" type="number" inputmode="numeric" step="1" min="1" max="99999999999999" required></label>
      <button class="btn btn-primary btn-block" id="save-expense">حفظ المصروف</button>
    </form>
  `);
  const form = document.getElementById("expense-form");
  const nameInput = document.getElementById("expense-name");
  nameInput.focus();
  nameInput.oninput = ()=>nameInput.setCustomValidity("");
  form.onsubmit = async (event)=>{
    event.preventDefault();
    const name = nameInput.value.trim();
    if(!name){
      nameInput.setCustomValidity("اكتب اسم المصروف");
      nameInput.reportValidity();
      return;
    }
    const amount = Number(document.getElementById("expense-amount").value);
    if(!Number.isSafeInteger(amount) || amount<1 || !session) return;
    const owner = session.user.id;
    const btn = document.getElementById("save-expense");
    btn.disabled = true;
    try{
      const {error:insertError} = await sb.from("expenses")
        .upsert({id:expenseId,name,amount},{onConflict:"id",ignoreDuplicates:true});
      if(insertError) throw insertError;
      const {data,error} = await sb.from("expenses").select("id,name,amount,date").eq("id",expenseId).single();
      if(error) throw error;
      if(session?.user.id !== owner) return;
      state.data.expenses = [...state.data.expenses.filter(e=>e.id!==data.id), {...data, amount:Number(data.amount)}];
      if(form.isConnected) closeModal();
      render();
    }catch(error){
      console.error("تعذر تسجيل المصروف",error);
      flashSaveError();
      btn.disabled = false;
    }
  };
}

/* ---------------- modal + nav plumbing ---------------- */
function openSheet(title, innerHtml){
  document.getElementById("sheet-body").innerHTML = `
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="close-x" data-action="close-modal">✕</button></div>
    ${innerHtml}
  `;
  document.getElementById("modal-root").classList.add("open");
}
function closeModal(){ document.getElementById("modal-root").classList.remove("open"); }

document.getElementById("modal-root").addEventListener("click", (e)=>{
  if(e.target.dataset.action==="close-modal") closeModal();
});
document.getElementById("bottomnav").addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-goto]");
  if(btn){ state.tab = btn.dataset.goto; render(); }
});
document.getElementById("content").addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-goto]");
  if(btn){ state.tab = btn.dataset.goto; render(); }
});

initAuth();
</script>
</body>
